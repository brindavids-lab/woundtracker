<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Privacy lock: the page loads its own files only and the browser blocks every outgoing data connection. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wound Report Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6b6f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wound Reports">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  /* Layout idea: phone-first single column, one case at a time, four tabs that follow the clinic workflow. */
  --bg:#f2f6f6; --surface:#ffffff; --ink:#12262b; --muted:#566b70; --line:#d3dedf;
  --accent:#0b6b6f; --accent-ink:#ffffff; --accent-soft:#dcefee;
  --good:#1c7548; --warn:#96560a; --bad:#b0362e;
  --display:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1718; --surface:#152224; --ink:#e5eeee; --muted:#94a9ac; --line:#2a3c3f;
    --accent:#4fbfbc; --accent-ink:#062120; --accent-soft:#17373a;
    --good:#62cf97; --warn:#e4aa55; --bad:#ef8b81; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1718; --surface:#152224; --ink:#e5eeee; --muted:#94a9ac; --line:#2a3c3f;
  --accent:#4fbfbc; --accent-ink:#062120; --accent-soft:#17373a;
  --good:#62cf97; --warn:#e4aa55; --bad:#ef8b81; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
#app{max-width:860px;margin:0 auto;padding:16px 16px 80px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.45rem} h2{font-size:1.1rem} h3{font-size:.95rem}
.muted{color:var(--muted);font-size:.875rem}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-decoration:none}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--bad)}
button.small,.btn.small{min-height:36px;padding:6px 10px;font-size:.875rem}
button:focus-visible,.btn:focus-within,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;padding:8px 4px;font-size:.9rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid.three{grid-template-columns:repeat(3,1fr)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-height:44px}
textarea{min-height:120px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border-radius:999px;min-height:38px;padding:6px 12px;font-size:.9rem}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list{display:flex;flex-direction:column;gap:12px}
.caserow{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:12px}
.caserow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;border:1px solid currentColor;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.flat{color:var(--muted)}
.tag{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);border:1px dashed var(--warn);border-radius:6px;padding:1px 6px}
.vhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.vhead .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.thumb{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg);padding:0;min-height:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumbwrap{display:flex;flex-direction:column;gap:4px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare figure,.timeline figure{margin:0;display:flex;flex-direction:column;gap:6px}
.compare img,.timeline img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--bg);display:block;cursor:zoom-in}
.timeline{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
figcaption{font-size:.82rem;color:var(--muted)}
figcaption b{color:var(--ink);display:block}
svg text{font-family:var(--body)}
.icdrow{justify-content:flex-start;text-align:left;gap:10px;min-height:40px;padding:8px 10px;font-weight:400;width:100%}
.icdrow b{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent)}
.tag2{font-size:.7rem;border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--muted);white-space:nowrap}
.bp{fill:var(--bg);stroke:var(--muted);stroke-width:1.2;cursor:pointer}
.bp.on{fill:var(--accent);stroke:var(--accent)}
.bodymap{display:flex;flex-direction:column;gap:8px;align-items:center}
.bodymap svg{width:100%;max-width:290px;height:auto;touch-action:manipulation}
.paper td.wh{background:#d5e2e2;font-weight:bold;text-align:center}
.bar{display:grid;grid-template-columns:minmax(110px,38%) 1fr 28px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{background:var(--bg);border-radius:6px;height:14px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.notice{border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.paperwrap{overflow-x:auto}
.paper{background:#fff;color:#111;border:1px solid #c9c9c9;padding:24px;min-width:560px;font-size:13px;line-height:1.4;font-family:Arial,Helvetica,sans-serif}
.paper h2{font-family:Arial,Helvetica,sans-serif;text-align:center;font-size:18px;color:#111}
.paper .icd{text-align:center;margin:6px 0 12px}
.paper table{width:100%;border-collapse:collapse;table-layout:fixed}
.paper td{border:1px solid #777;padding:5px 7px;vertical-align:top;word-wrap:break-word;white-space:pre-wrap}
.paper td.l{background:#eef2f2;font-weight:bold;width:28%}
.paper .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;white-space:normal}
.paper .pgrid img{width:100%;max-height:260px;object-fit:contain;display:block;background:#f4f4f4}
.paper .ck{display:inline-flex;align-items:center;gap:5px;margin:0 12px 3px 0;white-space:nowrap}
.paper .ck i{width:11px;height:11px;border:1px solid #222;display:inline-block}
.paper .ck.on{font-weight:bold} .paper .ck.on i{background:#222}
.paper p{margin:10px 0 0} .paper .small{font-size:11px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh}
dialog::backdrop{background:rgba(0,0,0,.8)}
dialog img{max-width:96vw;max-height:86vh;display:block;border-radius:8px}
dialog form{display:flex;justify-content:center;padding-top:8px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;min-height:0;padding:0}
@media (max-width:420px){.grid.three{grid-template-columns:1fr 1fr 1fr}.tabs button{font-size:.8rem}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  #app{max-width:none;padding:0}
  .paper{border:0;padding:0;min-width:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="lightbox"><img alt="Wound photo enlarged" id="lightimg"><form method="dialog"><button>Close</button></form></dialog>
<script src="jspdf.umd.min.js"></script>
<script>
"use strict";
/* ---------- options taken from the report template ---------- */
const OPT = {
  bed:["Granulating","Epithelialising","Sloughy","Necrotic","Hypergranulating","Mixed","Exposed bone / tendon"],
  exType:["None","Serous (clear thin watery)","Serosanguineous (pink watery)","Sanguineous (bloody)","Seropurulent","Purulent"],
  exLevel:["None","Low","Moderate","High"],
  edges:["Healthy / Intact","Macerated","Rolled (epibole)","Undermined","Callused","Erythematous"],
  phase:["Haemostasis","Inflammatory","Proliferative","Maturation"],
  infection:["None","Local infection","Spreading infection","Systemic infection","Biofilm suspected"],
  painSev:["0","1-3","4-6","7-10"],
  painFreq:["None","Only at dressing change","Intermittent","Constant"],
  debridement:["None","Autolytic","Sharp","Mechanical","Enzymatic","Surgical","Biological"],
  types:["Diabetic ulcer","Pressure Injury","Post surgical wound","Leg ulcer","Venous (CEAP)","Arterial","Cancer","Burns (rule of 9)","Dermatological condition","Mixed","Moisture associated skin damage (MASD)"],
  healability:["Healable wound","Maintenance Wound","Non-Healable / Palliative Wound"],
  frequency:["Daily","3 x Weekly","2 x Weekly","Weekly","Every 2 weeks"]
};
const ASSESS = [["bed","Wound Bed"],["exType","Type of Exudate"],["exLevel","Levels of Exudate"],["edges","Edges"],["phase","Wound Healing Phase"],["infection","Infection"],["painSev","Pain severity"],["painFreq","Pain Frequency"],["debridement","Debridement"]];
const HISTORY_LABEL = "History of previous advanced or conservative wound treatment and current treatment:";
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const ord = n => n+(n%100>=11&&n%100<=13?"th":["th","st","nd","rd"][n%10]||"th");
function fmtDate(iso, ordinal){ if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); if(!y||!m||!d) return iso; return (ordinal?ord(d):d)+" "+MONTHS[m-1]+" "+y; }
function shortDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); return d+" "+MONTHS[m-1].slice(0,3)+" "+y; }
const num = v => { const n=parseFloat(v); return isFinite(n)&&n>0?n:null; };
const area = v => { const l=num(v.l), w=num(v.w); return l&&w ? Math.round(l*w*10)/10 : null; };
function dimText(v){ const p=[v.l,v.w,v.d].filter(x=>x!==""&&x!=null).map(x=>x+"cm"); return p.join(" x "); }
const visitsAsc = c => [...c.visits].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||a.id.localeCompare(b.id));
function change(c){ const pts=visitsAsc(c).map(area).filter(a=>a!=null); if(pts.length<2) return null; return Math.round((pts[pts.length-1]-pts[0])/pts[0]*100); }
function changePill(c){ const ch=change(c); if(ch==null) return '<span class="pill flat">No trend yet</span>'; const cls=ch<0?"good":ch>0?"bad":"flat"; return `<span class="pill ${cls}">${ch<0?"Area down ":ch>0?"Area up ":"Area unchanged "}${ch===0?"":Math.abs(ch)+"%"}</span>`; }
let toastT; function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3200); }

/* ---------- storage: IndexedDB on this device, memory if the browser refuses ---------- */
const store = (()=>{
  const mem={cases:new Map(),photos:new Map(),meta:new Map()}; let dbp=null; const api={ok:true};
  function open(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ try{ const r=indexedDB.open("woundReportTracker",1);
    r.onupgradeneeded=()=>{ for(const s of Object.keys(mem)) r.result.createObjectStore(s); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error("blocked")); }catch(e){rej(e);} });
    return dbp; }
  async function tx(s,mode,fn){ const db=await open(); return new Promise((res,rej)=>{ const t=db.transaction(s,mode); const rq=fn(t.objectStore(s)); t.oncomplete=()=>res(rq&&rq.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
  async function guard(run,fallback){ if(api.ok){ try{ return await run(); }catch(e){ api.ok=false; } } return fallback(); }
  api.get=(s,k)=>guard(()=>tx(s,"readonly",o=>o.get(k)),()=>mem[s].get(k));
  api.set=(s,k,v)=>{ mem[s].set(k,v); return guard(()=>tx(s,"readwrite",o=>o.put(v,k)),()=>{}); };
  api.del=(s,k)=>{ mem[s].delete(k); return guard(()=>tx(s,"readwrite",o=>o.delete(k)),()=>{}); };
  api.all=s=>guard(()=>tx(s,"readonly",o=>o.getAll()),()=>[...mem[s].values()]);
  api.keys=s=>guard(()=>tx(s,"readonly",o=>o.getAllKeys()),()=>[...mem[s].keys()]);
  return api;
})();

/* ---------- state ---------- */
let cases=[]; let settings={practitioner:"",title:"Sr.",practiceNo:"",email:"",phone:""};
const ui={view:"dash",caseId:null,tab:"details",openVisit:null,woundId:null,bodyMap:false,bodyView:"front"};
const cur = () => cases.find(c=>c.id===ui.caseId);
let saveT; function queueSave(){ const c=cur(); if(!c) return; clearTimeout(saveT); saveT=setTimeout(()=>saveCase(c),300); }
function saveCase(c){ c.updated=Date.now(); return store.set("cases",c.id,JSON.parse(JSON.stringify(c))); }
let setT; function queueSettings(){ clearTimeout(setT); setT=setTimeout(()=>store.set("meta","settings",settings),300); }
const photoCache=new Map();
async function getPhoto(id){ if(photoCache.has(id)) return photoCache.get(id); const p=await store.get("photos",id); if(p){ if(photoCache.size>40) photoCache.delete(photoCache.keys().next().value); photoCache.set(id,p); } return p; }
const SITES=["Head / face","Scalp / back of head","Neck (front)","Neck (back)","Chest","Breast","Abdomen","Groin / pelvis","Perineum","Upper back","Lower back","Sacrum","Coccyx","Buttock","Ischium","Hip / trochanter","Shoulder","Shoulder (back)","Upper arm","Upper arm (back)","Elbow","Forearm","Forearm (back)","Wrist","Hand","Finger","Thigh (front)","Thigh (back)","Knee","Knee (back)","Lower leg (shin)","Calf","Ankle","Inner ankle (medial malleolus)","Outer ankle (lateral malleolus)","Heel","Foot (top)","Foot (sole)","Toe","Amputation stump"];
const SIDES=["Left","Right","Midline","Bilateral"];
const siteText = w => w.region ? (w.side==="Midline" ? w.region+" (midline)" : w.side ? w.side+" "+w.region.charAt(0).toLowerCase()+w.region.slice(1) : w.region) : (w.site||"");
function newWound(){ return {id:uid(),site:"",region:"",side:"",types:[],healability:"",dressings:"",visits:[]}; }
function newCase(){ return {id:uid(),name:"",billing:"",aid:"",aidNo:"",idNo:"",dep:"",refDr:"",practiceNo:"",startDate:today(),icd:"",history:"",frequency:"",nextVisit:"",reportPhotos:"last4",wounds:[newWound()]}; }
/* older records held one wound on the patient: move it into the wounds list */
function normalize(c){ if(!Array.isArray(c.wounds)){ c.wounds=[{id:uid(),site:c.site||"",region:"",side:"",types:c.types||[],healability:c.healability||"",dressings:c.dressings||"",visits:c.visits||[]}]; for(const k of ["site","types","healability","dressings","visits"]) delete c[k]; }
  if(!c.wounds.length) c.wounds.push(newWound()); for(const w of c.wounds){ w.types=w.types||[]; w.visits=w.visits||[]; } return c; }
const curW = () => { const c=cur(); return c ? (c.wounds.find(w=>w.id===ui.woundId)||c.wounds[0]) : null; };
const allVisits = c => c.wounds.flatMap(w=>w.visits);
function newVisit(w){ const last=visitsAsc(w).pop()||{}; const v={id:uid(),date:today(),l:"",w:"",d:"",note:"",photos:[]}; for(const [k] of ASSESS) v[k]=last[k]||""; return v; }

/* ---------- example case (fictional, drawn images) ---------- */
function drawExample(l,w,label){ const cv=document.createElement("canvas"); cv.width=800; cv.height=600; const g=cv.getContext("2d");
  g.fillStyle="#d9c2b0"; g.fillRect(0,0,800,600); g.fillStyle="#b9463f"; g.beginPath(); g.ellipse(400,300,l*32,w*32,0,0,Math.PI*2); g.fill();
  g.strokeStyle="#7d2a26"; g.lineWidth=6; g.stroke(); g.fillStyle="#fff"; g.fillRect(40,520,320,40); g.fillStyle="#111";
  for(let i=0;i<=10;i++) g.fillRect(40+i*32,520,2,i%5?14:24); g.font="600 22px sans-serif"; g.fillText("EXAMPLE IMAGE  "+label,40,50);
  return {data:cv.toDataURL("image/jpeg",0.8),w:800,h:600}; }
async function seed(){
  const c=newCase(); Object.assign(c,{example:true,name:"Example Patient",billing:"EX-0001",aid:"Example Medical Scheme",aidNo:"000000000",idNo:"0000000000000",dep:"00",refDr:"Dr Example",practiceNo:"0000000",startDate:"2026-09-01",icd:"L97 Z48.0",
    history:"This is an example case. Replace this text with the treatment history, complications, co-morbidities and your request for authorisation.",frequency:"2 x Weekly",nextVisit:"2026-10-02"});
  const w0=c.wounds[0]; Object.assign(w0,{region:"Lower leg (shin)",side:"Left",site:"Left lower leg (shin)",types:["Leg ulcer","Post surgical wound"],healability:"Healable wound",dressings:"Dressing tray, cleaning solution, antimicrobial dressing, padding."});
  const rows=[["2026-09-01",8,6,1,"Inflammatory","Moderate"],["2026-09-08",7.5,5.5,0.8,"Inflammatory","Moderate"],["2026-09-18",6,4.5,0.5,"Proliferative","Low"],["2026-09-29",4.5,3,0.3,"Proliferative","Low"]];
  for(const [date,l,w,d,phase,lvl] of rows){ const pid=uid(); await store.set("photos",pid,drawExample(l,w,shortDate(date)));
    w0.visits.push({id:uid(),date,l:String(l),w:String(w),d:String(d),note:"",photos:[pid],bed:"Granulating",exType:"Serous (clear thin watery)",exLevel:lvl,edges:"Healthy / Intact",phase,infection:"None",painSev:"1-3",painFreq:"Only at dressing change",debridement:"Autolytic"}); }
  cases.push(c); await saveCase(c); await store.set("meta","seeded",true);
}

/* ---------- form builders ---------- */
const fid = b => "f-"+b.replace(/[^a-z0-9]+/gi,"-");
function inp(label,bind,value,type="text",extra=""){ return `<label class="f" for="${fid(bind)}">${esc(label)}<input id="${fid(bind)}" type="${type}" data-bind="${bind}" value="${esc(value)}" ${extra}></label>`; }
function sel(label,bind,value,options){ const o=options.includes(value)||!value?options:[value,...options]; return `<label class="f" for="${fid(bind)}">${esc(label)}<select id="${fid(bind)}" data-bind="${bind}"><option value="">Select</option>${o.map(x=>`<option${x===value?" selected":""}>${esc(x)}</option>`).join("")}</select></label>`; }
function area_(label,bind,value,ph=""){ return `<label class="f" for="${fid(bind)}">${esc(label)}<textarea id="${fid(bind)}" data-bind="${bind}" placeholder="${esc(ph)}">${esc(value)}</textarea></label>`; }

/* ---------- views ---------- */
function render(){
  const app=$("#app"); const c=cur();
  if(ui.view==="case"&&c) app.innerHTML=viewCase(c); else if(ui.view==="settings") app.innerHTML=viewSettings(); else if(ui.view==="home") app.innerHTML=viewHome(); else { ui.view="dash"; app.innerHTML=viewDash(); }
  hydrate(); if($("#icd-desc")) icdDescribe();
}
async function hydrate(){ for(const img of document.querySelectorAll("img[data-pid]")){ if(img.getAttribute("src")) continue; const p=await getPhoto(img.dataset.pid); if(p) img.src=p.data; } }
const storageNote = () => store.ok?"":`<div class="notice">This browser is not saving data. Download a backup from Settings before you close this page.</div>`;

const addDays=(iso,n)=>{ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const dayDiff=(a,b)=>Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/864e5);
let lastBackup=null;
function dashData(){ const t=today(), in7=addDays(t,7), ago7=addDays(t,-7), alerts=[], recent=[], types={}; let wounds=0, visits7=0;
  for(const c of cases) for(const w of c.wounds){ wounds++; const n=c.wounds.indexOf(w)+1, vs=visitsAsc(w), last=vs[vs.length-1], who=(c.name||"Unnamed patient")+(c.wounds.length>1?" · wound "+n:"")+(w.site?" · "+w.site:"");
    for(const k of (w.types.length?w.types:["Type not set"])) types[k]=(types[k]||0)+1;
    for(const v of vs){ if(v.date>ago7&&v.date<=t) visits7++; recent.push({c,w,v,who}); }
    const pts=vs.filter(v=>area(v)!=null&&v.date); const go=`${c.id}|${w.id}`;
    if(last&&last.infection&&last.infection!=="None") alerts.push({lvl:"bad",who,go,msg:"Infection recorded at the last visit: "+last.infection});
    if(pts.length>1){ const a=area(pts[pts.length-1]), p=area(pts[pts.length-2]), f=area(pts[0]), days=dayDiff(pts[0].date,pts[pts.length-1].date), red=Math.round((f-a)/f*100);
      if(a>p) alerts.push({lvl:"bad",who,go,msg:`Area grew from ${p} to ${a} cm² since the visit before`});
      else if(days>=28&&red<30&&(!w.healability||w.healability==="Healable wound")) alerts.push({lvl:"warn",who,go,msg:`${red<0?0:red}% smaller after ${days} days. Review the treatment plan`}); } }
  const due=cases.filter(c=>c.nextVisit&&c.nextVisit<=in7).sort((a,b)=>a.nextVisit.localeCompare(b.nextVisit)).map(c=>({c,late:c.nextVisit<t,today:c.nextVisit===t}));
  const fields=[["name","patient name"],["aid","medical aid name"],["aidNo","medical aid number"],["idNo","ID number"],["icd","ICD-10 codes"]];
  const gaps=cases.filter(c=>!c.example).map(c=>({c,miss:fields.filter(([k])=>!c[k]).map(x=>x[1]).concat(c.wounds.some(w=>!w.site)?["wound site"]:[],c.wounds.some(w=>!w.visits.length)?["first visit"]:[])})).filter(x=>x.miss.length);
  recent.sort((a,b)=>(b.v.date||"").localeCompare(a.v.date||""));
  return {t,wounds,visits7,alerts,due,gaps,recent:recent.slice(0,5),types:Object.entries(types).sort((a,b)=>b[1]-a[1])}; }
function viewDash(){ const d=dashData(), real=cases.some(c=>!c.example), bdays=lastBackup?Math.floor((Date.now()-lastBackup)/864e5):null;
  const rowBtn=(action,id,main,sub,pill)=>`<button class="caserow" data-action="${action}" data-id="${id}"><span class="grow"><strong>${esc(main)}</strong><span class="muted">${esc(sub)}</span></span>${pill||""}</button>`;
  const maxT=Math.max(1,...d.types.map(x=>x[1]));
  return `<div class="top"><div class="grow"><h1>Wound Report Tracker</h1><div class="muted">${esc(fmtDate(d.t))}${settings.practitioner?" · "+esc(settings.title+" "+settings.practitioner):""}</div></div><button data-action="settings">Settings</button></div>${storageNote()}
  ${!settings.practitioner?'<div class="notice">Add your practitioner details in Settings. They print on every report.</div>':""}
  <div class="actions"><button class="primary" data-action="patients">Patients (${cases.length})</button><button data-action="newCase">New patient</button></div>
  <div class="tiles"><div class="tile"><span class="muted">Patients</span><b>${cases.length}</b></div><div class="tile"><span class="muted">Wounds tracked</span><b>${d.wounds}</b></div>
  <div class="tile"><span class="muted">Visits, last 7 days</span><b>${d.visits7}</b></div><div class="tile"><span class="muted">Follow ups due</span><b>${d.due.length}</b><span class="muted">${d.due.filter(x=>x.late).length} overdue</span></div></div>
  <div class="card"><h2>Needs attention</h2>${d.alerts.map(a=>rowBtn("goWound",a.go,a.who,a.msg,`<span class="pill ${a.lvl}">${a.lvl==="bad"?"Act":"Review"}</span>`)).join("")||'<div class="muted">No wounds flagged. A wound appears here when the area grows, when a healable wound is under 30% smaller after 4 weeks, or when infection is recorded.</div>'}</div>
  <div class="card"><h2>Follow ups, next 7 days</h2>${d.due.map(x=>rowBtn("openCase",x.c.id,x.c.name||"Unnamed patient",fmtDate(x.c.nextVisit)+(x.c.frequency?" · "+x.c.frequency:""),`<span class="pill ${x.late?"bad":x.today?"warn":"flat"}">${x.late?"Overdue":x.today?"Today":"Upcoming"}</span>`)).join("")||'<div class="muted">No follow up visits due. Set the next follow up date on each patient.</div>'}</div>
  ${d.gaps.length?`<div class="card"><h2>Reports missing details</h2>${d.gaps.map(x=>rowBtn("openCase",x.c.id,x.c.name||"Unnamed patient","Missing: "+x.miss.join(", "))).join("")}</div>`:""}
  <div class="card"><h2>Wounds by type</h2>${d.types.map(([k,n])=>`<div class="bar"><span>${esc(k)}</span><span class="track"><i style="width:${Math.round(n/maxT*100)}%"></i></span><b>${n}</b></div>`).join("")||'<div class="muted">No wounds yet.</div>'}</div>
  <div class="card"><h2>Recent visits</h2>${d.recent.map(r=>rowBtn("goWound",`${r.c.id}|${r.w.id}`,r.who,shortDate(r.v.date)+(dimText(r.v)?" · "+dimText(r.v):"")+(r.v.phase?" · "+r.v.phase:""))).join("")||'<div class="muted">No visits yet.</div>'}</div>
  ${real?`<div class="card"><h2>Backup</h2><div class="${bdays==null||bdays>7?"notice":"muted"}">${bdays==null?"No backup made on this device yet.":bdays===0?"Last backup: today.":"Last backup: "+bdays+" day"+(bdays===1?"":"s")+" ago."} Records live on this device only.</div><div class="actions"><button data-action="backup">Download backup</button></div></div>`:""}
  <div class="card"><h2>Clinical basis</h2><p class="muted" style="margin:0">The design of this tracker follows the wound bed preparation paradigm: treat the cause, address patient-centred concerns, determine healability, and manage local wound care.</p>
  <p style="margin:0;font-size:.9rem">Smart H, Sibbald RG, Goodman L, Ayello EA, Jaimangal R, Gregory JH, et al. Wound Bed Preparation 2024: Delphi Consensus on Foot Ulcer Management in Resource-Limited Settings. <i>Advances in Skin &amp; Wound Care</i>. 2024;37(4):180-196. PMID 38354304.</p>
  <p style="margin:0;font-size:.9rem"><a href="https://doi.org/10.1097/ASW.0000000000000120" target="_blank" rel="noopener" style="color:var(--accent);word-break:break-all">https://doi.org/10.1097/ASW.0000000000000120</a></p></div>
  <p class="muted">Private by design. Patient records and photos stay on this device. This app sends nothing to any server. Open source under the MIT licence. App version 11.</p>`;
}

  ${list.length>5?'<label class="f" for="pt-q">Find a patient<input id="pt-q" type="search" autocomplete="off" placeholder="Name, medical aid number or site"></label>':""}
  <div class="list" id="ptlist">${list.map(c=>{ const vs=visitsAsc({visits:allVisits(c)}), last=vs[vs.length-1], pid=last&&last.photos[0], nw=c.wounds.length;

const BODY={front:[["Head / face",0,"e",0,28,14,17],["Neck (front)",0,"r",-6,45,12,10],["Chest",0,"r",-26,55,52,42],["Abdomen",0,"r",-24,97,48,34],["Groin / pelvis",0,"r",-24,131,48,22],["Shoulder",1,"e",34,62,9,9],["Upper arm",1,"r",33,71,14,42],["Elbow",1,"e",40,120,8,8],["Forearm",1,"r",34,128,14,38],["Hand",1,"e",42,177,8,11],["Thigh (front)",1,"r",2,153,22,52],["Knee",1,"e",13,213,11,9],["Lower leg (shin)",1,"r",4,222,19,43],["Ankle",1,"e",13.5,270,8,6],["Foot (top)",1,"e",14.5,284,10,7]],
  back:[["Scalp / back of head",0,"e",0,28,14,17],["Neck (back)",0,"r",-6,45,12,10],["Upper back",0,"r",-26,55,52,42],["Lower back",0,"r",-24,97,48,28],["Buttock",1,"e",13,141,12,15],["Sacrum",0,"e",0,131,7,8],["Shoulder (back)",1,"e",34,62,9,9],["Upper arm (back)",1,"r",33,71,14,42],["Elbow",1,"e",40,120,8,8],["Forearm (back)",1,"r",34,128,14,38],["Hand",1,"e",42,177,8,11],["Thigh (back)",1,"r",2,157,22,48],["Knee (back)",1,"e",13,213,11,9],["Calf",1,"r",4,222,19,43],["Heel",1,"e",13.5,277,9,9]]};
function bodyMap(w){ const view=ui.bodyView, parts=[];
  for(const [name,paired,shape,x,y,a,b] of BODY[view]) for(const dir of paired?[1,-1]:[0]){ const side=!paired?"":(dir===1)===(view==="front")?"Left":"Right";
    const on=w.region===name&&(paired?w.side===side:true), attr=`class="bp${on?" on":""}" data-action="site" data-id="${esc(name)}|${side}"`, t=`<title>${esc((side?side+" ":"")+name)}</title>`;
    if(shape==="e") parts.push(`<ellipse ${attr} cx="${80+(dir||1)*x}" cy="${y}" rx="${a}" ry="${b}">${t}</ellipse>`);
    else parts.push(`<rect ${attr} x="${dir===-1?80-x-a:80+x}" y="${y}" width="${a}" height="${b}" rx="5">${t}</rect>`); }
  return `<div class="bodymap"><div class="chips"><button aria-pressed="${view==="front"}" data-action="bodyView" data-id="front">Front</button><button aria-pressed="${view==="back"}" data-action="bodyView" data-id="back">Back</button></div>
  <svg viewBox="0 0 160 300" role="group" aria-label="Body diagram, ${view} view">${parts.join("")}
  <text x="6" y="14" font-size="9" fill="var(--muted)">${view==="front"?"Right":"Left"}</text><text x="154" y="14" font-size="9" text-anchor="end" fill="var(--muted)">${view==="front"?"Left":"Right"}</text></svg>
  <div class="muted">${w.site?"Selected: "+esc(w.site):"Tap the body area of the wound. Sides are the patient's left and right."}</div></div>`; }

function chart(c){
  const pts=visitsAsc(c).map(v=>({d:v.date,a:area(v)})).filter(p=>p.a!=null&&p.d);
  if(pts.length<2) return '<p class="muted">Record length and width on two or more visits to see the trend.</p>';
  const W=640,H=260,L=48,R=20,T=40,B=34; const t=p=>new Date(p.d+"T00:00:00").getTime(); const t0=t(pts[0]), t1=t(pts[pts.length-1]);
  const raw=Math.max(...pts.map(p=>p.a)); const step=Math.pow(10,Math.floor(Math.log10(raw))); const max=Math.ceil(raw/step)*step;
  const x=(p,i)=>L+(t1>t0?(t(p)-t0)/(t1-t0):i/(pts.length-1))*(W-L-R), y=a=>T+(1-a/max)*(H-T-B);
  const line=pts.map((p,i)=>(i?"L":"M")+x(p,i).toFixed(1)+" "+y(p.a).toFixed(1)).join(" ");
  const ticks=[0,max/2,max];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Wound area in square centimetres by visit date">
  ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`).join("")}
  <text x="${L}" y="12" font-size="12" fill="var(--muted)">Area, cm² (length x width)</text>
  <path d="${line} L${x(pts[pts.length-1],pts.length-1)} ${y(0)} L${x(pts[0],0)} ${y(0)} Z" fill="var(--accent-soft)"/>
  <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(p,i)}" cy="${y(p.a)}" r="${i===pts.length-1?6:4}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>${pts.length<=8?`<text x="${x(p,i)}" y="${y(p.a)-10}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}" font-size="12" font-weight="600" fill="var(--ink)">${p.a}</text>`:""}`).join("")}

const clean = s => String(s??"").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/•/g,"-").replace(/ /g," ").replace(/[^\x09\x0A\x20-\x7E¡-ÿ]/g,"?");
async function buildPdf(c){
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"}); const m=model(c);
  const M=14,W=182,BOT=283,LW=52,PAD=1.8,LH=4.4; let y=18;
  doc.setLineWidth(0.2); doc.setDrawColor(110); doc.setTextColor(17);
  doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.text("WOUND MANAGEMENT REPORT",105,y,{align:"center"}); y+=6.5;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); if(m.icd){ doc.text(clean(m.icd),105,y,{align:"center"}); y+=3; } y+=3;
  const page=()=>{ doc.addPage(); y=16; };
  function row(cells){ doc.setFontSize(9.5);
    const pc=cells.map(c=>{ doc.setFont("helvetica",c.b?"bold":"normal"); return {...c,lines:doc.splitTextToSize(clean(c.t),c.w-2*PAD)}; });
    const total=Math.max(1,...pc.map(c=>c.lines.length)); let start=0;
    if(total<=8 && y+total*LH+2*PAD>BOT) page();
    while(start<total){ let fit=Math.floor((BOT-y-2*PAD)/LH); if(fit<1){ page(); continue; }
      const n=Math.min(fit,total-start), h=n*LH+2*PAD; let x=M;
      for(const c of pc){ if(c.b){ doc.setFillColor(236,241,241); doc.rect(x,y,c.w,h,"FD"); } else doc.rect(x,y,c.w,h);
        doc.setFont("helvetica",c.b?"bold":"normal"); const ls=c.lines.slice(start,start+n); if(ls.length) doc.text(ls,x+PAD,y+PAD+3.2,{lineHeightFactor:LH/(9.5*0.3528)}); x+=c.w; }
      y+=h; start+=n; } }
  const rows=list=>{ for(const r of list) row(r.length===4?[{t:r[0],w:LW,b:1},{t:r[1],w:44},{t:r[2],w:40,b:1},{t:r[3],w:46}]:[{t:r[0],w:LW,b:1},{t:r[1],w:W-LW}]); };
  function checks(label,opts,on){ doc.setFontSize(9.5); doc.setFont("helvetica","bold"); const vw=W-LW-2*PAD, items=[]; let cx=0,line=0;
    for(const o of opts){ const tw=doc.getTextWidth(o)+4.5+5; if(cx>0&&cx+tw>vw+5){ line++; cx=0; } items.push({o,x:cx,line}); cx+=tw; }
    const lab=doc.splitTextToSize(label,LW-2*PAD), LH2=5.4, h=Math.max(line+1,lab.length)*LH2+2*PAD; if(y+h>BOT) page();
    doc.setFillColor(236,241,241); doc.rect(M,y,LW,h,"FD"); doc.rect(M+LW,y,W-LW,h); doc.text(lab,M+PAD,y+PAD+3.2);
    for(const it of items){ const sel=on.includes(it.o), bx=M+LW+PAD+it.x, by=y+PAD+it.line*LH2+0.4; doc.setFillColor(30,30,30); doc.rect(bx,by,3,3,sel?"FD":"S"); doc.setFont("helvetica",sel?"bold":"normal"); doc.text(it.o,bx+4.3,by+2.7); }
    y+=h; }
  rows(m.head); const CW=W/2, BW=CW-6, BH=58;
  for(const x of m.wounds){ const ph=x.photos;
  if(m.multi){ if(y+30>BOT) page(); doc.setFillColor(213,226,226); doc.rect(M,y,W,7,"FD"); doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.text(clean(x.title),105,y+4.8,{align:"center"}); y+=7; }
  rows([["Site and picture",x.site]]);
  for(let i=0;i<ph.length;i+=2){ const hh=BH+15; if(y+hh>BOT) page();
    for(let j=0;j<2;j++){ const p=ph[i+j], x=M+j*CW; doc.rect(x,y,CW,hh); if(!p) continue; const img=await getPhoto(p.pid);
      if(img){ const s=Math.min(BW/img.w,BH/img.h), iw=img.w*s, ih=img.h*s; try{ doc.addImage(img.data,"JPEG",x+(CW-iw)/2,y+3+(BH-ih)/2,iw,ih,undefined,"FAST"); }catch(e){} }
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text(clean(p.l1),x+3,y+BH+7.5); if(p.l2) doc.text(clean(p.l2),x+3,y+BH+12); }
    y+=hh; }
  rows(x.assess); checks("Wound description",OPT.types,x.w.types); checks("Healability",OPT.healability,[x.w.healability]); if(m.multi) rows([["Dressings",x.w.dressings]]); }
  rows(m.tail);
  function para(t,o={}){ doc.setFont("helvetica",o.b?"bold":"normal"); doc.setFontSize(o.s||10); const lh=(o.s||10)*0.3528*1.3; const ls=doc.splitTextToSize(clean(t),W);
    for(const l of ls){ if(y+lh>BOT+4) page(); y+=lh; doc.text(l,M,y); } y+=o.gap??2.5; }
  y+=4; m.foot.forEach((t,i)=>para(t,{gap:i===3?0.5:2.5}));

}
async function saveFile(filename,blob){
  let dl=null; try{ if(window.claude&&window.claude.use) dl=await window.claude.use("downloads"); }catch(e){}
  if(dl){ try{ await dl.save({filename,data:blob}); toast("File saved"); }catch(e){ toast(e&&e.code==="declined"?"Save cancelled":"This view did not save the file. Open the page in a browser and try again."); } return; }
  if(matchMedia("(pointer:coarse)").matches&&navigator.canShare){ try{ const f=new File([blob],filename,{type:blob.type||"application/octet-stream"});
    if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:filename}); return; } }catch(e){ if(e&&e.name==="AbortError") return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),20000);
}

const icdToks=q=>q.toLowerCase().replace(/skin tears?|lacerations?/g,"open wound").split(/[^a-z0-9.\-]+/).filter(Boolean);
function icdQuickRows(){ return (settings.customIcd||[]).map(x=>({code:x.code,d:x.label||"My own code",tag:"My code"})).concat(ICD_QUICK.map(([code,d,pmb,src])=>({code,d,pmb,tag:src}))); }
function icdQuickSearch(q){ const toks=icdToks(q); return icdQuickRows().filter(r=>{ const t=(r.code+" "+r.d+" "+(r.pmb||"")).toLowerCase(); return toks.every(k=>(ICD_SYN[k]||[k]).some(a=>t.includes(a))); })
  .map((r,i)=>{ const d=r.d.toLowerCase(), k=toks[0], p=d.indexOf(k); return [(r.tag==="My code"?-1000:0)+(p<0?500:d.includes("non-"+k)?400:p)+i/1000,r]; }).sort((a,b)=>a[0]-b[0]).map(x=>x[1]); }
function icdTitle(k){ if(!icdMap) return null; let p=k; while(p.length>=3&&!icdMap.has(p)) p=p.slice(0,-1).replace(/\.$/,""); const d=icdMap.get(p); return d?{p,d}:null; }
function icdRow(r){ const o=r.tag?icdTitle(r.code):null; const off=r.tag?(o?(o.p===r.code?"":"closest "+o.p+": ")+o.d:""):(r.par&&r.par!==r.d?r.par:"");
  return `<button class="icdrow" data-action="icdAdd" data-id="${esc(r.code)}"><b>${esc(r.code)}</b><span>${esc(r.d)}${r.pmb?" · PMB "+esc(r.pmb):""}${off?`<span class="muted"> · ${esc(off)}</span>`:""}${r.tag?` <span class="tag2">${esc(r.tag)}</span>`:""}</span></button>`; }
const ICD_NOTE='<div class="muted">Tap a code to add. Sheet codes and PMB codes come from your practice sheets. Other results come from the ICD-10 WHO 2019 list. Check each code against the South African ICD-10 Master Industry Table before you submit.</div>';
async function icdRun(q,browse){ const box=$("#icd-res"); if(!box) return; if(!browse&&q.trim().length<2){ box.innerHTML=""; return; }
  if(!icdIdx){ box.innerHTML='<div class="muted">Loading the code list</div>'; await icdLoad(); }
  const el=$("#icd-q"); if(!el||(!browse&&el.value!==q)) return;
  if(browse){ box.innerHTML=icdQuickRows().sort((a,b)=>(a.tag==="My code"?0:1)-(b.tag==="My code"?0:1)||a.d.localeCompare(b.d)).map(icdRow).join("")+ICD_NOTE; return; }
  const quick=icdQuickSearch(q), seen=new Set(quick.map(r=>r.code)), who=icdIdx?icdSearch(q).filter(r=>!seen.has(r.code)):[];
  const typed=q.trim().toUpperCase(), codeLike=/^[A-Z]\d{2}(\.[A-Z0-9]{1,4})?$/.test(typed), exact=codeLike&&(seen.has(typed)||who.some(r=>r.code===typed));
  const add=codeLike&&!exact?`<button class="icdrow" data-action="icdTyped" data-id="${esc(typed)}"><b>${esc(typed)}</b><span>Add this code as typed and save to my list</span></button>`:"";
  box.innerHTML=(quick.length||who.length||add)?add+quick.map(icdRow).join("")+who.map(icdRow).join("")+ICD_NOTE:'<div class="muted">No codes match. Try a different word, or add your own code below.</div>'; }
async function icdDescribe(){ const c=cur(), box=$("#icd-desc"); if(!c||!box) return; const codes=(c.icd||"").toUpperCase().split(/[\s,;]+/).filter(Boolean); if(!codes.length){ box.innerHTML=""; return; } await icdLoad(); const b2=$("#icd-desc"); if(!b2) return; const rows=icdQuickRows();
  b2.innerHTML=codes.map(k=>{ const own=rows.find(r=>r.code===k), o=icdTitle(k); const d=o&&o.p===k?o.d:own?own.d+" ("+own.tag+")":o?"closest match "+o.p+": "+o.d:""; return `<div><b>${esc(k)}</b> ${d?esc(d):"not in the lists. Check this code."}</div>`; }).join("")
    +(codes.some(k=>/^S\d/.test(k))&&!codes.some(k=>/^[VWXY]\d/.test(k))?'<div class="notice" style="margin-top:8px">An S code needs an external cause code (V, W, X or Y). Search for the cause, for example fall, dog bite or motorcycle.</div>':""); }
function icdAddToCase(c,id){ const codes=(c.icd||"").split(/[\s,;]+/).filter(Boolean); if(codes.includes(id)) return false; codes.push(id); c.icd=codes.join(" "); saveCase(c); const f=$("#"+fid("case|icd")); if(f) f.value=c.icd; icdDescribe(); return true; }
function icdSaveOwn(code,label){ const list=settings.customIcd=(settings.customIcd||[]).filter(x=>x.code!==code); list.unshift({code,label}); store.set("meta","settings",settings); }

let icdT; document.addEventListener("input",e=>{ if(e.target.id==="pt-q"){ const q=e.target.value.trim().toLowerCase(); for(const r of document.querySelectorAll("#ptlist [data-find]")) r.style.display=r.dataset.find.includes(q)?"":"none"; return; } if(e.target.id==="icd-q"){ const q=e.target.value; clearTimeout(icdT); icdT=setTimeout(()=>icdRun(q),180); return; } if(e.target.id===fid("case|icd")){ clearTimeout(icdT); icdT=setTimeout(icdDescribe,400); } const b=e.target.dataset&&e.target.dataset.bind; if(!b) return; const [kind,a,k]=b.split("|"); const val=e.target.value;
  if(kind==="set"){ settings[a]=val; queueSettings(); return; } const c=cur(); if(!c) return;
  if(kind==="case") c[a]=val; else if(kind==="wound") curW()[a]=val; else { const v=curW().visits.find(x=>x.id===a); if(v) v[k]=val; } queueSave(); if(e.target.dataset.rerender) render(); });
document.addEventListener("change",async e=>{ const t=e.target; if(t.dataset.wsite){ const c=cur(), w=curW(); if(!w) return; w[t.dataset.wsite]=t.value; w.site=siteText(w); saveCase(c); render(); return; }
  if(t.dataset.photo){ const c=cur(), v=c&&curW().visits.find(x=>x.id===t.dataset.photo); if(!v) return; let n=0;
    for(const f of t.files){ try{ const p=await fileToPhoto(f), id=uid(); await store.set("photos",id,p); v.photos.push(id); n++; }catch(err){ toast("One file is not an image this browser reads"); } }
    if(n){ await saveCase(c); toast(n+" photo"+(n>1?"s":"")+" added"); } render(); }
  else if(t.dataset.restore&&t.files[0]) restore(t.files[0]); });
const armed=new WeakMap();
document.addEventListener("click",async e=>{ const el=e.target.closest("[data-action]"); if(!el) return; const act=el.dataset.action, id=el.dataset.id, c=cur(), w=curW();
  if(el.dataset.confirm&&!armed.get(el)){ armed.set(el,el.textContent); el.textContent="Tap again to confirm"; setTimeout(()=>{ if(el.isConnected&&armed.get(el)){ el.textContent=armed.get(el); armed.delete(el); } },3000); return; }
  switch(act){
    case "home": if(c) await saveCase(c); ui.view="home"; ui.caseId=null; break;
    case "settings": ui.view="settings"; break;
    case "dash": ui.view="dash"; ui.caseId=null; break;
    case "patients": ui.view="home"; ui.caseId=null; break;
    case "goWound": { const [cid,wid]=id.split("|"); Object.assign(ui,{view:"case",caseId:cid,woundId:wid,tab:"progress",openVisit:null,bodyMap:false}); break; }
    case "newCase": { const n=newCase(); cases.push(n); await saveCase(n); Object.assign(ui,{view:"case",caseId:n.id,tab:"details",woundId:null,openVisit:null,bodyMap:false}); break; }
    case "openCase": Object.assign(ui,{view:"case",caseId:id,tab:"details",openVisit:null,woundId:null,bodyMap:false}); break;
    case "tab": ui.tab=id; break;
    case "wound": ui.woundId=id; ui.openVisit=null; break;
    case "addWound": { const nw=newWound(); c.wounds.push(nw); ui.woundId=nw.id; ui.openVisit=null; ui.tab="details"; ui.bodyMap=true; await saveCase(c); render(); const wc=$("#woundcard"); if(wc) wc.scrollIntoView(); toast("Wound "+c.wounds.length+" added. Choose the site."); return; }
    case "delWound": { for(const v of w.visits) for(const p of v.photos) await store.del("photos",p); c.wounds=c.wounds.filter(x=>x!==w); ui.woundId=null; saveCase(c); toast("Wound deleted"); break; }
    case "bodyMap": ui.bodyMap=!ui.bodyMap; break;
    case "bodyView": ui.bodyView=id; break;
    case "site": { const [region,side]=id.split("|"); w.region=region; w.side=side; w.site=siteText(w); saveCase(c); break; }
    case "type": w.types=w.types.includes(id)?w.types.filter(x=>x!==id):[...w.types,id]; saveCase(c); break;
    case "heal": w.healability=w.healability===id?"":id; saveCase(c); break;
    case "addVisit": { const v=newVisit(w); w.visits.push(v); ui.openVisit=v.id; saveCase(c); break; }
    case "toggleVisit": ui.openVisit=ui.openVisit===id?null:id; saveCase(c); break;
    case "delVisit": { const v=w.visits.find(x=>x.id===id); for(const p of v.photos) await store.del("photos",p); w.visits=w.visits.filter(x=>x.id!==id); saveCase(c); break; }
    case "delPhoto": { const [vid,pid]=id.split("|"); const v=w.visits.find(x=>x.id===vid); v.photos=v.photos.filter(p=>p!==pid); await store.del("photos",pid); saveCase(c); break; }
    case "delCase": for(const v of allVisits(c)) for(const p of v.photos) await store.del("photos",p); await store.del("cases",c.id); cases=cases.filter(x=>x.id!==c.id); ui.view="home"; ui.caseId=null; toast("Patient deleted"); break;
    case "icdAdd": toast(icdAddToCase(c,id)?id+" added":id+" is already on the report"); return;
    case "icdTyped": icdSaveOwn(id,""); icdAddToCase(c,id); toast(id+" added and saved to your list"); return;
    case "icdBrowse": icdRun("",true); return;
    case "icdSave": { const code=$("#icd-new-code").value.trim().toUpperCase(), label=$("#icd-new-desc").value.trim(); if(!/^[A-Z]\d{2}(\.?[A-Z0-9]{1,4})?$/.test(code)){ toast("Type a code such as W01.09 or L97"); return; } icdSaveOwn(code,label); icdAddToCase(c,code); $("#icd-new-code").value=""; $("#icd-new-desc").value=""; toast(code+" added and saved to your list"); return; }
    case "icdDel": settings.customIcd=(settings.customIcd||[]).filter(x=>x.code!==id); await store.set("meta","settings",settings); break;
    case "zoom": { const p=await getPhoto(id); if(p){ $("#lightimg").src=p.data; $("#lightbox").showModal(); } return; }
    case "pdf": { if(!window.jspdf){ toast("The PDF library did not load. Check your connection and reload."); return; } toast("Building the PDF"); try{ const blob=await buildPdf(c); await saveFile("Wound report "+(c.name||"patient").replace(/[^\w ]+/g,"").trim()+" "+today()+".pdf",blob); }catch(err){ toast("The PDF did not build: "+(err.message||err)); } return; }
    case "print": window.print(); return;
    case "backup": await backup(); return;
  }
  render(); if(["home","settings","newCase","openCase","tab","dash","patients","goWound"].includes(act)) window.scrollTo(0,0);
});
window.addEventListener("pagehide",()=>{ const c=cur(); if(c) saveCase(c); });

(async function init(){
  const s=await store.get("meta","settings"); if(s) settings={...settings,...s};
  cases=(await store.all("cases")||[]).map(normalize); lastBackup=await store.get("meta","lastBackup")||null;
  if(!cases.length && !(await store.get("meta","seeded"))) await seed();
  render();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();
</script>
